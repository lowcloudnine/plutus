name: Build PyInstaller Distributions

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Linux Qt runtime dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb-cursor0

      - name: Sync dependencies
        run: uv sync --extra build

      - name: Smoke test encrypted database
        run: uv run python -c "from pathlib import Path; from tempfile import TemporaryDirectory; from plutus.database import Database, Holding, is_plaintext_sqlite_database; tmp=TemporaryDirectory(); path=Path(tmp.name) / 'plutus.sqlite3'; db=Database(path, 'ci-password'); row_id=db.add_holding(Holding(None, 'Gold', 1.0, 2.0, 'CI', '2026-04-25', '')); db.close(); assert row_id == 1; assert path.exists(); assert not is_plaintext_sqlite_database(path)"

      - name: Build application
        run: uv run pyinstaller plutus.spec --clean

      - name: Verify bundled application exists
        run: uv run python -c "from pathlib import Path; import sys; candidates = [Path('dist/plutus.exe'), Path('dist/plutus'), Path('dist/Plutus.app')]; existing = [path for path in candidates if path.exists()]; assert existing, f'No bundled application found in dist for {sys.platform}'"

      - name: Upload bundled application
        uses: actions/upload-artifact@v4
        with:
          name: plutus-${{ matrix.os }}
          path: |
            dist/plutus
            dist/plutus.exe
            dist/Plutus.app
          if-no-files-found: error
