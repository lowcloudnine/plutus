name: Build PyInstaller Distributions

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Linux Qt runtime dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb-cursor0

      - name: Sync dependencies
        run: uv sync --extra build

      - name: Build application
        run: uv run pyinstaller plutus.spec --clean

      - name: Upload bundled application
        uses: actions/upload-artifact@v4
        with:
          name: plutus-${{ matrix.os }}
          path: |
            dist/plutus
            dist/plutus.exe
          if-no-files-found: error
